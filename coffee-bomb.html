<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>커피내기 폭탄 돌리기 | HR Fun</title>
    <style>
        :root {
            --primary-color: #e74c3c;
            --secondary-color: #2c3e50;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #333;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            transition: background-color 0.5s ease;
        }

        /* 무지개 배경 애니메이션 */
        @keyframes rainbow-bg {
            0% { background-color: #ffadad; }
            14% { background-color: #ffd6a5; }
            28% { background-color: #fdffb6; }
            42% { background-color: #caffbf; }
            56% { background-color: #9bf6ff; }
            70% { background-color: #a0c4ff; }
            84% { background-color: #bdb2ff; }
            100% { background-color: #ffadad; }
        }

        .playing-bg {
            animation: rainbow-bg 5s linear infinite;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.9); /* 배경 비침 효과 */
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            position: relative;
            z-index: 10;
        }

        h1 {
            color: var(--secondary-color);
            margin-bottom: 30px;
            font-size: 24px;
        }

        /* 설정 화면 */
        #setup-screen textarea {
            width: 100%;
            height: 150px;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 16px;
            resize: none;
            box-sizing: border-box;
        }

        #setup-screen p {
            font-size: 14px;
            color: #666;
            margin-bottom: 20px;
        }

        /* 게임 화면 */
        #game-screen {
            display: none;
        }

        .bomb-container {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 0 auto 30px;
        }

        .bomb-icon {
            font-size: 120px;
            line-height: 200px;
            transition: transform 0.1s;
        }

        .ticking {
            animation: shake 0.5s infinite;
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        .current-player {
            font-size: 32px;
            font-weight: 800;
            color: var(--primary-color);
            margin-bottom: 10px;
        }

        .next-info {
            font-size: 16px;
            color: #7f8c8d;
            margin-bottom: 30px;
        }

        /* 결과 화면 */
        #result-screen {
            display: none;
        }

        .winner-msg {
            font-size: 20px;
            margin-bottom: 10px;
        }

        .winner-name {
            font-size: 48px;
            font-weight: 900;
            color: var(--primary-color);
            margin-bottom: 30px;
            display: block;
        }

        /* 공통 버튼 */
        .btn {
            background-color: var(--secondary-color);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .btn-pass {
            background-color: var(--primary-color);
            font-size: 24px;
            padding: 20px;
        }

        .btn-reset {
            background-color: #95a5a6;
            margin-top: 10px;
        }

        /* 빵 터지는 효과 */
        .explosion {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: white;
            z-index: 100;
            display: none;
            justify-content: center;
            align-items: center;
            font-size: 100px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 설정 화면 -->
    <div id="setup-screen">
        <h1>☕ 커피내기 폭탄 돌리기</h1>
        <p>참여자의 이름을 한 줄에 한 명씩 입력하세요.</p>
        <textarea id="player-names" placeholder="홍길동&#10;김철수&#10;이영희"></textarea>
        <button class="btn" onclick="startGame()">게임 시작!</button>
    </div>

    <!-- 게임 화면 -->
    <div id="game-screen">
        <div class="current-player" id="display-name">준비...</div>
        <div class="next-info" id="next-name">다음 차례: -</div>
        
        <div class="bomb-container">
            <div class="bomb-icon" id="bomb-emoji">💣</div>
        </div>

        <button class="btn btn-pass" id="pass-btn" onclick="passBomb()">폭탄 넘기기!</button>
        <p style="margin-top: 20px; font-size: 14px; color: #999;">타이머는 랜덤입니다 (15~40초)</p>
    </div>

    <!-- 결과 화면 -->
    <div id="result-screen">
        <div class="winner-msg">오늘 커피 당첨자는...</div>
        <span class="winner-name" id="winner-display"></span>
        <div style="font-size: 60px; margin-bottom: 20px;">💸</div>
        <button class="btn" onclick="location.reload()">다시 하기</button>
    </div>
</div>

<div class="explosion" id="explosion-effect">💥</div>

<script>
    let players = [];
    let currentIndex = 0;
    let timer = null;
    let isGameOver = false;

    function startGame() {
        const input = document.getElementById('player-names').value.trim();
        if (!input) {
            alert('참여자 이름을 입력해주세요!');
            return;
        }

        players = input.split('\n').map(name => name.trim()).filter(name => name !== '');
        if (players.length < 2) {
            alert('최소 2명 이상의 참여자가 필요합니다.');
            return;
        }

        // 이름 랜덤 셔플
        players.sort(() => Math.random() - 0.5);

        document.getElementById('setup-screen').style.display = 'none';
        document.getElementById('game-screen').style.display = 'block';
        
        // 배경 무지개 애니메이션 시작
        document.body.classList.add('playing-bg');
        
        currentIndex = 0;
        updateDisplay();

        // 15초 ~ 40초 사이의 랜덤 타이머 설정
        const randomTime = Math.floor(Math.random() * (40000 - 15000 + 1)) + 15000;
        
        timer = setTimeout(explode, randomTime);
        startTicking();
    }

    function updateDisplay() {
        document.getElementById('display-name').innerText = players[currentIndex];
        const nextIndex = (currentIndex + 1) % players.length;
        document.getElementById('next-name').innerText = `다음 차례: ${players[nextIndex]}`;
    }

    function passBomb() {
        if (isGameOver) return;
        
        currentIndex = (currentIndex + 1) % players.length;
        updateDisplay();
        
        // 클릭 시 시각적 피드백
        const bomb = document.getElementById('bomb-emoji');
        bomb.style.transform = 'scale(1.2)';
        setTimeout(() => bomb.style.transform = 'scale(1)', 100);
    }

    function startTicking() {
        const bomb = document.getElementById('bomb-emoji');
        bomb.classList.add('ticking');
    }

    function explode() {
        isGameOver = true;
        
        // 배경 무지개 애니메이션 중지 및 빨간색 강조
        document.body.classList.remove('playing-bg');
        document.body.style.backgroundColor = '#e74c3c';

        const explosionEffect = document.getElementById('explosion-effect');
        
        // 펑! 효과음 대신 시각적 효과
        explosionEffect.style.display = 'flex';
        
        setTimeout(() => {
            explosionEffect.style.display = 'none';
            showResult();
        }, 1000);
    }

    function showResult() {
        document.body.style.backgroundColor = '#f8f9fa'; // 결과 화면 배경 초기화
        document.getElementById('game-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';
        document.getElementById('winner-display').innerText = players[currentIndex];
    }
</script>

</body>
</html>
